name: Build CoreNet-Diag (PyInstaller + Nuitka)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'          # 小写 v 开头
      - 'V*'          # 大写 V 开头也支持
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller nuitka pillow zstandard

      - name: 确保图标存在
        run: |
          if (-Not (Test-Path "assets/icon.ico")) {
            python make_icon.py
          } else {
            Write-Host "Using existing assets/icon.ico"
          }

      - name: 安装 UPX（PyInstaller 需要）
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: 构建 PyInstaller 版本
        run: |
          $VERSION_TAG = "${{ github.ref_name }}"
          if ($VERSION_TAG -notmatch '^[vV]') { $VERSION_TAG = "dev" }
          New-Item -ItemType Directory -Force -Path static
          pyinstaller -F -w `
            --name "CoreNetDiag_PyInstaller_$VERSION_TAG" `
            --icon=assets/icon.ico `
            --add-data "templates;templates" `
            --version-file=version_info.txt `
            --upx-dir "C:\ProgramData\chocolatey\bin" `
            --distpath dist_pyinstaller `
            app.py

      - name: 构建 Nuitka 版本
        run: |
          $VERSION_TAG = "${{ github.ref_name }}"

          # 强制转小写并去掉开头的 v/V
          $clean = $VERSION_TAG.ToLower() -replace '^v', ''

          if ($clean -match '^\d+(\.\d+)*$') {
            $DISPLAY_NAME = $VERSION_TAG          # 文件名保留原始标签（V1.0 或 v1.0）
            $RAW_VERSION  = $clean
          } else {
            $DISPLAY_NAME = "dev"
            $RAW_VERSION  = "0.0.0.0"
          }

          # 强制补齐为四段数字版本（Nuitka 强制要求）
          $parts = $RAW_VERSION.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $FULL_VERSION = ($parts[0..3] -join '.')

          Write-Host "DISPLAY_NAME = $DISPLAY_NAME"
          Write-Host "FULL_VERSION = $FULL_VERSION"

          $env:NUITKA_DEPS_DOWNLOAD = "yes"

          python -m nuitka `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/icon.ico `
            --file-version="$FULL_VERSION" `
            --product-version="$FULL_VERSION" `
            --include-data-dir=templates=templates `
            --output-dir=dist_nuitka `
            --output-filename="CoreNetDiag_Nuitka_$DISPLAY_NAME.exe" `
            --assume-yes-for-downloads `
            app.py

      - name: 合并产物目录
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item dist_pyinstaller/*.exe dist/
          Copy-Item dist_nuitka/*.exe dist/

      - name: 上传构建产物（两个版本）
        uses: actions/upload-artifact@v4
        with:
          name: CoreNetDiag-${{ github.run_number }}
          path: dist/*.exe

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
