name: Build CoreNet-Diag (PyInstaller + Nuitka)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller nuitka pillow zstandard

      - name: 确保图标存在
        run: |
          if (-Not (Test-Path "assets/icon.ico")) {
            python make_icon.py
          } else {
            Write-Host "Using existing assets/icon.ico"
          }

      - name: 安装 UPX（仅 PyInstaller 使用）
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: 构建 PyInstaller 版本
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ($VERSION -notmatch '^v') { $VERSION = "dev" }
          New-Item -ItemType Directory -Force -Path static
          pyinstaller -F -w `
            --name "CoreNetDiag_PyInstaller_$VERSION" `
            --icon=assets/icon.ico `
            --add-data "templates;templates" `
            --version-file=version_info.txt `
            --upx-dir "C:\ProgramData\chocolatey\bin" `
            --distpath dist_pyinstaller `
            app.py

      - name: 构建 Nuitka 版本
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ($VERSION -notmatch '^v') { $VERSION = "dev" }
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-disable-console `
            --windows-icon-from-ico=assets/icon.ico `
            --file-version="$VERSION" `
            --product-version="$VERSION" `
            --include-data-dir=templates=templates `
            --output-dir=dist_nuitka `
            --output-filename="CoreNetDiag_Nuitka_$VERSION.exe" `
            app.py

      - name: 合并产物目录
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item dist_pyinstaller/*.exe dist/
          Copy-Item dist_nuitka/*.exe dist/

      - name: 上传构建产物（两个版本）
        uses: actions/upload-artifact@v4
        with:
          name: CoreNetDiag-${{ github.run_number }}
          path: dist/*.exe

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
